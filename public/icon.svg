<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="50%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#101c3d"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ccff00"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.8"/>

  <!-- Quartet Cards Fan -->
  <!-- Card 1 -->
  <g transform="translate(190, 240) rotate(-18)">
    <rect x="-65" y="-100" width="130" height="200" rx="16" fill="#172754" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
    <text x="0" y="20" font-size="52" text-anchor="middle">🍓</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(230, 220) rotate(-6)">
    <rect x="-65" y="-100" width="130" height="200" rx="16" fill="#172754" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
    <text x="0" y="20" font-size="52" text-anchor="middle">🍓</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(275, 220) rotate(8)">
    <rect x="-65" y="-100" width="130" height="200" rx="16" fill="#172754" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
    <text x="0" y="20" font-size="52" text-anchor="middle">🍓</text>
  </g>

  <!-- Card 4 (Top Winning Card) -->
  <g transform="translate(320, 245) rotate(22)" filter="url(#neonGlow)">
    <rect x="-65" y="-100" width="130" height="200" rx="16" fill="#1f336e" stroke="#ccff00" stroke-width="5"/>
    <text x="0" y="20" font-size="52" text-anchor="middle">🍓</text>
    <rect x="-45" y="55" width="90" height="24" rx="6" fill="#ccff00"/>
    <text x="0" y="72" font-family="sans-serif" font-weight="900" font-size="14" fill="#050914" text-anchor="middle">SET! 🔥</text>
  </g>

  <!-- Title Badge -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#ccff00" text-anchor="middle" letter-spacing="4" filter="url(#neonGlow)">SET!</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#00f5d4" text-anchor="middle" letter-spacing="2">4-OF-A-KIND ARENA</text>
</svg>
