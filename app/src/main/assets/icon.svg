<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Flame Gradients -->
    <linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="flameMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="60%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGradLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cardGradRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base App Background (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#F97316" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Radial Ambience behind cards -->
  <circle cx="256" cy="245" r="150" fill="#EA580C" opacity="0.16" filter="url(#flameGlow)"/>

  <!-- Group: Cards and Flame -->
  <g transform="translate(0, -10)">
    <!-- BACK CARD (Left, tilted -12 deg) -->
    <g transform="translate(210, 255) rotate(-14)" filter="url(#cardShadow)">
      <rect x="-80" y="-120" width="160" height="240" rx="20" fill="url(#cardGradLeft)" stroke="#CBD5E1" stroke-width="2"/>
      <!-- Card back mini accents -->
      <rect x="-68" y="-108" width="136" height="216" rx="14" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6,4"/>
      <!-- Top-left corner card suit -->
      <path d="M-60,-95 L-55,-90 L-50,-95 L-55,-100 Z" fill="#EA580C"/>
      <!-- Bottom-right corner card suit -->
      <path d="M50,95 L55,100 L60,95 L55,90 Z" fill="#EA580C"/>
    </g>

    <!-- FRONT CARD (Right, tilted +10 deg) -->
    <g transform="translate(295, 265) rotate(11)" filter="url(#cardShadow)">
      <rect x="-80" y="-120" width="160" height="240" rx="20" fill="url(#cardGradRight)" stroke="#FFFFFF" stroke-width="3"/>
      <!-- Card inner border -->
      <rect x="-68" y="-108" width="136" height="216" rx="14" fill="none" stroke="#F1F5F9" stroke-width="2"/>
      <!-- Top-left corner diamond -->
      <polygon points="-58,-95 -52,-86 -58,-77 -64,-86" fill="#DC2626"/>
      <polygon points="58,95 64,86 58,77 52,86" fill="#DC2626"/>
    </g>

    <!-- DYNAMIC MINIMALIST FLAME (Centered with slap impact) -->
    <g transform="translate(256, 250)" filter="url(#flameGlow)">
      <!-- Outer Flame -->
      <path d="M0,85 
               C-55,85 -85,50 -85,5 
               C-85,-35 -55,-60 -35,-95 
               C-25,-75 -15,-55 -5,-45 
               C0,-80 15,-115 35,-130 
               C30,-95 50,-65 65,-40 
               C78,-20 85,5 85,30 
               C85,65 50,85 0,85 Z" 
            fill="url(#flameOuter)"/>

      <!-- Mid Flame -->
      <path d="M0,72 
               C-38,72 -60,45 -60,10 
               C-60,-22 -40,-45 -22,-70 
               C-16,-52 -8,-36 0,-28 
               C5,-55 18,-80 30,-92 
               C26,-66 42,-44 50,-24 
               C58,-6 60,12 60,30 
               C60,56 35,72 0,72 Z" 
            fill="url(#flameMid)"/>

      <!-- Inner Core Flame -->
      <path d="M0,58 
               C-22,58 -34,40 -34,16 
               C-34,-8 -20,-24 -10,-42 
               C-6,-30 0,-18 4,-12 
               C8,-30 16,-46 22,-52 
               C20,-36 30,-22 34,-8 
               C38,4 34,18 34,28 
               C34,46 20,58 0,58 Z" 
            fill="url(#flameCore)"/>

      <!-- Slap Shockwave / Sparks -->
      <!-- Top Left Spark -->
      <polygon points="-80,-70 -85,-82 -97,-87 -85,-92 -80,-104 -75,-92 -63,-87 -75,-82" fill="#FDE047"/>
      <!-- Top Right Spark -->
      <polygon points="85,-80 90,-90 100,-95 90,-100 85,-110 80,-100 70,-95 80,-90" fill="#FBBF24"/>
      <!-- Right Spark -->
      <polygon points="95,-15 100,-23 108,-27 100,-31 95,-39 90,-31 82,-27 90,-23" fill="#F97316"/>
      <!-- Left Spark -->
      <polygon points="-95,-10 -100,-18 -108,-22 -100,-26 -95,-34 -90,-26 -82,-22 -90,-18" fill="#F97316"/>
    </g>

    <!-- SET! Pill Badge -->
    <g transform="translate(256, 395)">
      <!-- Pill Container with Glow -->
      <rect x="-85" y="-25" width="170" height="50" rx="25" fill="#0F172A" stroke="#F97316" stroke-width="3"/>
      <!-- Text -->
      <text x="0" y="9" font-family="'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">
        SET<tspan fill="#F97316">!</tspan>
      </text>
    </g>
  </g>
</svg>
